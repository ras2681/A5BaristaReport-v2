<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A5 Barista Report</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding:24px 16px 40px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  margin-top:25px;
}

.subtitle{
  text-align:center;
  color:#999;
  letter-spacing:3px;
  margin:4px 0 35px;
}

.card{
  background:#1b1b1b;
  border:1px solid #303030;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}

h2{
  margin:0 0 18px;
}

label{
  display:block;
  color:#aaa;
  font-size:14px;
  margin:15px 0 7px;
}

input,
textarea{
  width:100%;
  background:#101010;
  border:1px solid #383838;
  color:#fff;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#d5a84b;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.pin{
  text-align:center;
  font-size:28px;
  letter-spacing:8px;
}

button{
  border:0;
  border-radius:13px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#d5a84b;
  color:#111;
  margin-top:16px;
}

.secondary{
  width:100%;
  background:#292929;
  color:#fff;
  border:1px solid #3b3b3b;
  margin-top:10px;
}

.danger{
  background:#432525;
  color:#ffb2b2;
}

.hidden{
  display:none!important;
}

.msg{
  display:none;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

.error{
  display:block;
  background:#3b2020;
  color:#ffb0b0;
}

.success{
  display:block;
  background:#193723;
  color:#9be0ad;
}

.userbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.username{
  font-size:21px;
  font-weight:800;
}

.role{
  color:#d5a84b;
  font-size:13px;
  margin-top:3px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.tabs button{
  background:#1b1b1b;
  color:#aaa;
  border:1px solid #303030;
}

.tabs button.active{
  background:#d5a84b;
  color:#111;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#101010;
  border:1px solid #303030;
  border-radius:13px;
  padding:14px;
}

.stat-title{
  color:#999;
  font-size:13px;
}

.stat-value{
  font-size:21px;
  font-weight:800;
  margin-top:5px;
}

.total{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.report{
  border-top:1px solid #303030;
  padding:15px 0;
}

.report:first-child{
  border-top:0;
}

.report-head{
  display:flex;
  justify-content:space-between;
}

.muted{
  color:#999;
  font-size:13px;
}

.empty{
  color:#999;
  text-align:center;
  padding:25px 5px;
}

.logout{
  padding:9px 12px;
  font-size:13px;
}

/* USER SELECT */

.user-select{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.user-option{
  width:100%;
  background:#101010;
  color:#fff;
  border:1px solid #383838;
  text-align:left;
  padding:16px;
  border-radius:13px;
}

.user-option:active{
  transform:scale(.99);
}

.user-option-name{
  font-size:18px;
  font-weight:800;
}

.user-option-role{
  color:#999;
  font-size:13px;
  margin-top:4px;
}

.selected-user{
  background:#101010;
  border:1px solid #383838;
  border-radius:12px;
  padding:13px 14px;
  margin-bottom:14px;
}

.selected-user-name{
  font-size:18px;
  font-weight:800;
}

.selected-user-role{
  color:#999;
  font-size:13px;
  margin-top:3px;
}

.back-button{
  width:100%;
  background:#292929;
  color:#fff;
  border:1px solid #3b3b3b;
  margin-top:10px;
}

.step-title{
  color:#999;
  font-size:14px;
  margin-bottom:7px;
}
</style>
</head>


<body>

<div class="app">


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

  <div class="logo">
    A5
  </div>

  <div class="subtitle">
    BARISTA REPORT
  </div>


  <!-- ВЫБОР ПОЛЬЗОВАТЕЛЯ -->

  <div id="userSelectCard" class="card">

    <h2>
      Кто входит?
    </h2>

    <div id="loginMsg" class="msg"></div>

    <div class="user-select">

      <button
        type="button"
        class="user-option"
        id="adminButton">

        <div class="user-option-name">
          Admin
        </div>

        <div class="user-option-role">
          Администратор
        </div>

      </button>


      <button
        type="button"
        class="user-option"
        id="barista1Button">

        <div class="user-option-name">
          Barista 1
        </div>

        <div class="user-option-role">
          Бариста
        </div>

      </button>


      <button
        type="button"
        class="user-option"
        id="barista2Button">

        <div class="user-option-name">
          Barista 2
        </div>

        <div class="user-option-role">
          Бариста
        </div>

      </button>

    </div>

  </div>


  <!-- ВВОД PIN -->

  <div id="pinCard" class="card hidden">

    <h2>
      Вход
    </h2>

    <div id="pinMsg" class="msg"></div>


    <div class="selected-user">

      <div
        id="selectedUserName"
        class="selected-user-name">
      </div>

      <div
        id="selectedUserRole"
        class="selected-user-role">
      </div>

    </div>


    <div class="step-title">
      Введите PIN-код
    </div>


    <input
      id="pin"
      class="pin"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
      placeholder="••••"
    >


    <button
      type="button"
      id="loginButton"
      class="primary">

      Войти

    </button>


    <button
      type="button"
      id="backButton"
      class="back-button">

      ← Выбрать другого пользователя

    </button>

  </div>

</div>



<!-- ================= APP ================= -->

<div id="appScreen" class="hidden">


  <div class="userbar">

    <div>

      <div
        id="userName"
        class="username">
      </div>

      <div
        id="userRole"
        class="role">
      </div>

    </div>


    <button
      type="button"
      id="logoutButton"
      class="danger logout">

      Выйти

    </button>

  </div>



  <!-- TABS -->

  <div class="tabs">

    <button
      type="button"
      id="reportTabBtn"
      class="active">

      Смена

    </button>


    <button
      type="button"
      id="historyTabBtn">

      История

    </button>

  </div>



  <!-- ================= REPORT ================= -->

  <div id="reportTab">

    <div class="card">

      <h2>
        Отчёт смены
      </h2>


      <div
        id="reportMsg"
        class="msg">
      </div>


      <label>
        Остаток на начало
      </label>

      <input
        id="opening"
        type="number"
        step="0.01"
      >


      <button
        type="button"
        id="balanceButton"
        class="secondary">

        Получить остаток предыдущей смены

      </button>


      <label>
        Наличные
      </label>

      <input
        id="cash"
        type="number"
        step="0.01"
        value="0"
      >


      <label>
        Банковская карта
      </label>

      <input
        id="card"
        type="number"
        step="0.01"
        value="0"
      >


      <label>
        QR
      </label>

      <input
        id="qr"
        type="number"
        step="0.01"
        value="0"
      >


      <h3 style="margin-top:25px">
        Расходы
      </h3>


      <label>
        Расход бариста
      </label>

      <input
        id="expenseBarista"
        type="number"
        step="0.01"
        value="0"
      >


      <label>
        Расход поставщику
      </label>

      <input
        id="expenseSupplier"
        type="number"
        step="0.01"
        value="0"
      >


      <label>
        Снятие / прочие расходы
      </label>

      <input
        id="expenseWithdrawal"
        type="number"
        step="0.01"
        value="0"
      >


      <label>
        Комментарий
      </label>

      <textarea
        id="comment"
        placeholder="Комментарий к смене"></textarea>

    </div>



    <!-- ИТОГ -->

    <div class="card">

      <h2>
        Итог
      </h2>


      <div class="grid">

        <div class="stat">

          <div class="stat-title">
            Продажи
          </div>

          <div
            id="sales"
            class="stat-value">

            0 ₽

          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Расходы
          </div>

          <div
            id="expenses"
            class="stat-value">

            0 ₽

          </div>

        </div>

      </div>


      <div style="margin-top:20px">

        <div class="muted">
          Ожидаемая наличность
        </div>

        <div
          id="expected"
          class="total">

          0 ₽

        </div>

      </div>


      <button
        type="button"
        id="saveButton"
        class="primary">

        Сохранить отчёт

      </button>

    </div>

  </div>



  <!-- ================= HISTORY ================= -->

  <div
    id="historyTab"
    class="hidden">

    <div class="card">


      <div
        style="display:flex;justify-content:space-between;align-items:center">

        <h2 style="margin:0">
          История
        </h2>


        <button
          type="button"
          id="historyRefreshButton"
          class="secondary"
          style="width:auto;margin:0;padding:9px 12px">

          Обновить

        </button>

      </div>


      <div id="history"></div>

    </div>

  </div>

</div>

</div>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hsfxdmjmvgbepurkhfxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sVGHTCnvYzWZ65_ltVMkNA_WMNyYUx0";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================================================
   VARIABLES
========================================================= */

let currentPin = "";
let currentUser = null;

let selectedUserName = "";
let selectedUserRole = "";



/* =========================================================
   HELPERS
========================================================= */

function val(id){

  const element =
    document.getElementById(id);

  if(!element){
    return 0;
  }

  return Number(
    element.value || 0
  );
}


function money(number){

  return Number(number || 0)
    .toLocaleString("ru-RU")
    + " ₽";

}


function message(id,text,type){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  element.className =
    "msg " + type;

  element.textContent =
    text;

}


function clearMessage(id){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  element.className =
    "msg";

  element.textContent =
    "";

}



/* =========================================================
   SELECT USER
========================================================= */

function selectUser(name,role){

  selectedUserName = name;
  selectedUserRole = role;


  clearMessage("loginMsg");
  clearMessage("pinMsg");


  document.getElementById(
    "selectedUserName"
  ).textContent = name;


  document.getElementById(
    "selectedUserRole"
  ).textContent = role;


  document.getElementById(
    "userSelectCard"
  ).classList.add("hidden");


  document.getElementById(
    "pinCard"
  ).classList.remove("hidden");


  const pin =
    document.getElementById("pin");


  pin.value = "";

  setTimeout(function(){

    pin.focus();

  },100);

}



/* =========================================================
   BACK TO USERS
========================================================= */

function backToUsers(){

  selectedUserName = "";
  selectedUserRole = "";


  clearMessage("loginMsg");
  clearMessage("pinMsg");


  document.getElementById(
    "pin"
  ).value = "";


  document.getElementById(
    "pinCard"
  ).classList.add("hidden");


  document.getElementById(
    "userSelectCard"
  ).classList.remove("hidden");

}



/* =========================================================
   LOGIN
========================================================= */

async function login(){

  clearMessage("pinMsg");


  if(!selectedUserName){

    message(
      "loginMsg",
      "Сначала выберите пользователя",
      "error"
    );

    backToUsers();

    return;
  }


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(pin.length !== 4){

    message(
      "pinMsg",
      "Введите 4-значный PIN",
      "error"
    );

    return;
  }


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  loginButton.disabled = true;
  loginButton.textContent = "Проверка...";


  try{

    const result =
      await supabase.rpc(
        "login_by_pin",
        {
          p_pin: pin
        }
      );


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      message(
        "pinMsg",
        "Ошибка: " + error.message,
        "error"
      );

      return;
    }


    if(!data || data.length === 0){

      message(
        "pinMsg",
        "Неверный PIN-код",
        "error"
      );

      return;
    }


    const user =
      data[0];


    /*
      Проверяем, что PIN принадлежит
      выбранному пользователю.
    */

    if(
      String(user.name).trim() !==
      String(selectedUserName).trim()
    ){

      message(
        "pinMsg",
        "Этот PIN не относится к выбранному пользователю",
        "error"
      );

      return;
    }


    /* УСПЕШНЫЙ ВХОД */

    currentPin = pin;
    currentUser = user;


    document.getElementById(
      "loginScreen"
    ).classList.add("hidden");


    document.getElementById(
      "appScreen"
    ).classList.remove("hidden");


    document.getElementById(
      "userName"
    ).textContent =
      currentUser.name;


    document.getElementById(
      "userRole"
    ).textContent =
      currentUser.role === "admin"
        ? "Администратор"
        : "Бариста";


    await loadBalance();

    calculate();

  }

  catch(error){

    message(
      "pinMsg",
      "Ошибка подключения: " +
      error.message,
      "error"
    );

  }

  finally{

    loginButton.disabled = false;
    loginButton.textContent = "Войти";

  }

}



/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  currentPin = "";
  currentUser = null;

  selectedUserName = "";
  selectedUserRole = "";


  document.getElementById(
    "appScreen"
  ).classList.add("hidden");


  document.getElementById(
    "loginScreen"
  ).classList.remove("hidden");


  document.getElementById(
    "pinCard"
  ).classList.add("hidden");


  document.getElementById(
    "userSelectCard"
  ).classList.remove("hidden");


  document.getElementById(
    "pin"
  ).value = "";


  clearMessage("loginMsg");
  clearMessage("pinMsg");

}



/* =========================================================
   BALANCE
========================================================= */

async function loadBalance(){

  const result =
    await supabase.rpc(
      "get_last_cash_balance"
    );


  const data =
    result.data;

  const error =
    result.error;


  if(error){

    console.log(
      "Ошибка получения остатка:",
      error
    );

    return;
  }


  document.getElementById(
    "opening"
  ).value =
    Number(data || 0);


  calculate();

}



/* =========================================================
   CALCULATION
========================================================= */

function calculate(){

  const opening =
    val("opening");

  const cash =
    val("cash");

  const card =
    val("card");

  const qr =
    val("qr");


  const expenseBarista =
    val("expenseBarista");

  const expenseSupplier =
    val("expenseSupplier");

  const expenseWithdrawal =
    val("expenseWithdrawal");


  const sales =
    cash + card + qr;


  const expenses =
    expenseBarista +
    expenseSupplier +
    expenseWithdrawal;


  const expected =
    opening +
    cash -
    expenses;


  document.getElementById(
    "sales"
  ).textContent =
    money(sales);


  document.getElementById(
    "expenses"
  ).textContent =
    money(expenses);


  document.getElementById(
    "expected"
  ).textContent =
    money(expected);

}



/* =========================================================
   SAVE REPORT
========================================================= */

async function saveReport(){

  clearMessage("reportMsg");


  if(!currentPin){

    message(
      "reportMsg",
      "Сначала выполните вход",
      "error"
    );

    return;
  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled = true;
  saveButton.textContent = "Сохранение...";


  try{

    const result =
      await supabase.rpc(
        "save_shift_report",
        {

          p_pin:
            currentPin,


          p_report_date:
            new Date()
              .toISOString()
              .slice(0,10),


          p_opening_cash:
            val("opening"),


          p_cash:
            val("cash"),


          p_card:
            val("card"),


          p_qr:
            val("qr"),


          p_expense_barista:
            val("expenseBarista"),


          p_expense_supplier:
            val("expenseSupplier"),


          p_expense_withdrawal:
            val("expenseWithdrawal"),


          p_comment:
            document
              .getElementById("comment")
              .value
              .trim()

        }
      );


    const error =
      result.error;


    if(error){

      message(
        "reportMsg",
        "Ошибка сохранения: " +
        error.message,
        "error"
      );

      return;
    }


    message(
      "reportMsg",
      "Отчёт успешно сохранён",
      "success"
    );


    document.getElementById(
      "cash"
    ).value = 0;


    document.getElementById(
      "card"
    ).value = 0;


    document.getElementById(
      "qr"
    ).value = 0;


    document.getElementById(
      "expenseBarista"
    ).value = 0;


    document.getElementById(
      "expenseSupplier"
    ).value = 0;


    document.getElementById(
      "expenseWithdrawal"
    ).value = 0;


    document.getElementById(
      "comment"
    ).value = "";


    await loadBalance();

    calculate();

  }

  catch(error){

    message(
      "reportMsg",
      "Ошибка подключения: " +
      error.message,
      "error"
    );

  }

  finally{

    saveButton.disabled = false;
    saveButton.textContent =
      "Сохранить отчёт";

  }

}



/* =========================================================
   HISTORY
========================================================= */

async function loadHistory(){

  const box =
    document.getElementById(
      "history"
    );


  box.innerHTML =
    '<div class="empty">Загрузка...</div>';


  const result =
    await supabase.rpc(
      "get_shift_reports"
    );


  const data =
    result.data;

  const error =
    result.error;


  if(error){

    box.innerHTML =
      '<div class="empty">' +
      'Ошибка загрузки: ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    box.innerHTML =
      '<div class="empty">' +
      'Отчётов пока нет' +
      '</div>';

    return;
  }


  box.innerHTML =
    data.map(function(r){

      const date =
        new Date(
          r.report_date
        ).toLocaleDateString(
          "ru-RU"
        );


      const expenses =
        Number(
          r.expense_barista || 0
        ) +

        Number(
          r.expense_supplier || 0
        ) +

        Number(
          r.expense_withdrawal || 0
        );


      return `
        <div class="report">

          <div class="report-head">

            <div>

              <b>
                ${escapeHtml(
                  r.barista_name || "—"
                )}
              </b>

              <div class="muted">
                ${date}
              </div>

            </div>


            <b>
              ${money(
                r.actual_cash
              )}
            </b>

          </div>


          <div
            class="muted"
            style="margin-top:8px">

            Наличные:
            ${money(r.cash)}

            · Карта:
            ${money(r.card)}

            · QR:
            ${money(r.qr)}

          </div>


          <div
            class="muted"
            style="margin-top:5px">

            Расходы:
            ${money(expenses)}

          </div>

        </div>
      `;

    }).join("");

}



/* =========================================================
   TABS
========================================================= */

function openTab(tab){

  const report =
    document.getElementById(
      "reportTab"
    );

  const history =
    document.getElementById(
      "historyTab"
    );


  const reportButton =
    document.getElementById(
      "reportTabBtn"
    );

  const historyButton =
    document.getElementById(
      "historyTabBtn"
    );


  if(tab === "report"){

    report.classList.remove(
      "hidden"
    );

    history.classList.add(
      "hidden"
    );


    reportButton.classList.add(
      "active"
    );

    historyButton.classList.remove(
      "active"
    );

  }

  else{

    report.classList.add(
      "hidden"
    );

    history.classList.remove(
      "hidden"
    );


    reportButton.classList.remove(
      "active"
    );

    historyButton.classList.add(
      "active"
    );


    loadHistory();

  }

}



/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}
