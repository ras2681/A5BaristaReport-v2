<style>

*{
  box-sizing:border-box;
}

body{

  background:#111;
  color:#f5f5f5;
  font-family:
    -apple-system,

.app{

.logo{

.subtitle{

.card{

}

h2{

}

label{

input,

input:focus,
textarea:focus{

}

textarea{

}

.pin{

  font-size:28px;

}

button{

  border-radius:13px;

  font-size:16px;

}

}

.primary{

}

.secondary{

}

.danger{

}

.hidden{

}

.msg{

  margin-bottom:12px;

.error{

  color:#ffb0b0;
}

.success{

}

}

.username{

  font-weight:800;
}

.role{

  font-size:13px;
  margin-top:3px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.tabs button{
  background:#1b1b1b;
  color:#aaa;
  border:1px solid #303030;
}

.tabs button.active{
  background:#d5a84b;
  color:#111;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#101010;
  border:1px solid #303030;
  border-radius:13px;
  padding:14px;
}

.stat-title{
  color:#999;
  font-size:13px;
}

.stat-value{
  font-size:21px;
  font-weight:800;
  margin-top:5px;
}

.total{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.report{
  border-top:1px solid #303030;
  padding:15px 0;
}

.report:first-child{
  border-top:0;
}

.report-head{
  display:flex;
  justify-content:space-between;
}

.muted{
  color:#999;
  font-size:13px;
}

.empty{
  color:#999;
  text-align:center;
  padding:25px 5px;
}

.logout{

  font-size:13px;

/* =========================
   ВЫБОР ПОЛЬЗОВАТЕЛЯ
========================= */

  grid-template-columns:1fr;

}

  padding:16px;

}

.user-option-name{

}

.user-option-role{

.selected-user{

  padding:13px 14px;

}

.selected-user-name{

}

.back-button{

  margin-top:10px;
}

.step-title{
  color:#999;
  font-size:14px;
  margin-bottom:7px;
}

</style>

<script>

/* =========================================================
   SUPABASE
   Используем обычный REST API.
   Библиотека supabase-js НЕ нужна.
========================================================= */

const SUPABASE_URL =
  "https://hsfxdmjmvgbepurkhfxl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sVGHTCnvYzWZ65_ltVMkNA_WMNyYUx0";



/* =========================================================
   RPC
========================================================= */

async function callRPC(functionName, params = {}){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/" +
      functionName,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(params)
      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }

  catch(e){

    data = text;

  }


  if(!response.ok){

    let message =
      "Ошибка Supabase";


    if(
      data &&
      typeof data === "object"
    ){

      message =
        data.message ||
        data.error_description ||
        data.hint ||
        JSON.stringify(data);

    }

    else if(text){

      message = text;

    }


    throw new Error(message);

  }


  return data;

}



/* =========================================================
   VARIABLES
========================================================= */

let currentPin = "";

let currentUser = null;

let selectedUserName = "";

let selectedUserRole = "";



/* =========================================================
   HELPERS
========================================================= */

function val(id){

  const element =
    document.getElementById(id);


  if(!element){

    return 0;

  }


  return Number(
    element.value || 0
  );

}



function money(number){

  return Number(number || 0)
    .toLocaleString("ru-RU")
    + " ₽";

}



function message(id,text,type){

  const element =
    document.getElementById(id);


  if(!element){

    return;

  }


  element.className =
    "msg " + type;


  element.textContent =
    text;

}



function clearMessage(id){

  const element =
    document.getElementById(id);


  if(!element){

    return;

  }


  element.className =
    "msg";


  element.textContent =
    "";

}



/* =========================================================
   ВЫБОР ПОЛЬЗОВАТЕЛЯ
========================================================= */

function selectUser(name,role){

  selectedUserName =
    name;

  selectedUserRole =
    role;


  clearMessage("loginMsg");

  clearMessage("pinMsg");


  document.getElementById(
    "selectedUserName"
  ).textContent =
    name;


  document.getElementById(
    "selectedUserRole"
  ).textContent =
    role;


  document.getElementById(
    "userSelectCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "pinCard"
  ).classList.remove(
    "hidden"
  );


  const pin =
    document.getElementById(
      "pin"
    );


  pin.value = "";


  setTimeout(
    function(){

      pin.focus();

    },
    100
  );

}



/* =========================================================
   НАЗАД К ВЫБОРУ
========================================================= */

function backToUsers(){

  selectedUserName = "";

  selectedUserRole = "";


  clearMessage("loginMsg");

  clearMessage("pinMsg");


  document.getElementById(
    "pin"
  ).value = "";


  document.getElementById(
    "pinCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "userSelectCard"
  ).classList.remove(
    "hidden"
  );

}



/* =========================================================
   LOGIN
========================================================= */

async function login(){

  clearMessage("pinMsg");


  if(!selectedUserName){

    message(
      "loginMsg",
      "Сначала выберите пользователя",
      "error"
    );

    return;

  }


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(pin.length !== 4){

    message(
      "pinMsg",
      "Введите 4-значный PIN",
      "error"
    );

    return;

  }


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  loginButton.disabled =
    true;


  loginButton.textContent =
    "Проверка...";


  try{


    const data =
      await callRPC(
        "login_by_pin",
        {
          p_pin:pin
        }
      );


    if(
      !data ||
      !Array.isArray(data) ||
      data.length === 0
    ){

      message(
        "pinMsg",
        "Неверный PIN-код",
        "error"
      );

      return;

    }


    const user =
      data[0];


    /*
      Проверяем,
      что PIN принадлежит
      выбранному пользователю.
    */

    if(
      String(user.name)
        .trim()
      !==
      String(selectedUserName)
        .trim()
    ){

      message(
        "pinMsg",
        "Этот PIN не относится к выбранному пользователю",
        "error"
      );

      return;

    }


    /* УСПЕШНЫЙ ВХОД */

    currentPin =
      pin;


    currentUser =
      user;


    document.getElementById(
      "loginScreen"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "appScreen"
    ).classList.remove(
      "hidden"
    );


    document.getElementById(
      "userName"
    ).textContent =
      currentUser.name;


    document.getElementById(
      "userRole"
    ).textContent =
      currentUser.role === "admin"
      ? "Администратор"
      : "Бариста";


    await loadBalance();

    calculate();


  }

  catch(error){

    message(
      "pinMsg",
      "Ошибка подключения: " +
      error.message,
      "error"
    );

  }


  finally{

    loginButton.disabled =
      false;


    loginButton.textContent =
      "Войти";

  }

}



/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  currentPin = "";

  currentUser = null;

  selectedUserName = "";

  selectedUserRole = "";


  document.getElementById(
    "appScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "loginScreen"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "pinCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "userSelectCard"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "pin"
  ).value = "";


  clearMessage("loginMsg");

  clearMessage("pinMsg");

}



/* =========================================================
   BALANCE
========================================================= */

async function loadBalance(){

  try{

    const data =
      await callRPC(
        "get_last_cash_balance"
      );


    document.getElementById(
      "opening"
    ).value =
      Number(data || 0);


    calculate();

  }

  catch(error){

    console.log(
      "Ошибка получения остатка:",
      error
    );

  }

}



/* =========================================================
   CALCULATION
========================================================= */

function calculate(){

  const opening =
    val("opening");


  const cash =
    val("cash");


  const card =
    val("card");


  const qr =
    val("qr");


  const expenseBarista =
    val("expenseBarista");


  const expenseSupplier =
    val("expenseSupplier");


  const expenseWithdrawal =
    val("expenseWithdrawal");


  const sales =
    cash +
    card +
    qr;


  const expenses =
    expenseBarista +
    expenseSupplier +
    expenseWithdrawal;


  const expected =
    opening +
    cash -
    expenses;


  document.getElementById(
    "sales"
  ).textContent =
    money(sales);


  document.getElementById(
    "expenses"
  ).textContent =
    money(expenses);


  document.getElementById(
    "expected"
  ).textContent =
    money(expected);

}



/* =========================================================
   SAVE REPORT
========================================================= */

async function saveReport(){

  clearMessage("reportMsg");


  if(!currentPin){

    message(
      "reportMsg",
      "Сначала выполните вход",
      "error"
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Сохранение...";


  try{


    await callRPC(
      "save_shift_report",
      {

        p_pin:
          currentPin,


        p_report_date:
          new Date()
            .toISOString()
            .slice(0,10),


        p_opening_cash:
          val("opening"),


        p_cash:
          val("cash"),


        p_card:
          val("card"),


        p_qr:
          val("qr"),


        p_expense_barista:
          val("expenseBarista"),


        p_expense_supplier:
          val("expenseSupplier"),


        p_expense_withdrawal:
          val("expenseWithdrawal"),


        p_comment:
          document
            .getElementById(
              "comment"
            )
            .value
            .trim()

      }
    );


    message(
      "reportMsg",
      "Отчёт успешно сохранён",
      "success"
    );


    document.getElementById(
      "cash"
    ).value = 0;


    document.getElementById(
      "card"
    ).value = 0;


    document.getElementById(
      "qr"
    ).value = 0;


    document.getElementById(
      "expenseBarista"
    ).value = 0;


    document.getElementById(
      "expenseSupplier"
    ).value = 0;


    document.getElementById(
      "expenseWithdrawal"
    ).value = 0;


    document.getElementById(
      "comment"
    ).value = "";


    await loadBalance();

    calculate();


  }

  catch(error){

    message(
      "reportMsg",
      "Ошибка сохранения: " +
      error.message,
      "error"
    );

  }


  finally{

    saveButton.disabled =
      false;


    saveButton.textContent =
      "Сохранить отчёт";

  }

}



/* =========================================================
   HISTORY
========================================================= */

async function loadHistory(){

  const box =
    document.getElementById(
      "history"
    );


  box.innerHTML =
    '<div class="empty">Загрузка...</div>';


  try{


    const data =
      await callRPC(
        "get_shift_reports"
      );


    if(
      !data ||
      !Array.isArray(data) ||
      data.length === 0
    ){

      box.innerHTML =
        '<div class="empty">' +
        'Отчётов пока нет' +
        '</div>';

      return;

    }


    box.innerHTML =
      data
        .map(
          function(r){

            const date =
              new Date(
                r.report_date
              )
              .toLocaleDateString(
                "ru-RU"
              );


            const expenses =
              Number(
                r.expense_barista || 0
              ) +

              Number(
                r.expense_supplier || 0
              ) +

              Number(
                r.expense_withdrawal || 0
              );


            return `

              <div class="report">

                <div class="report-head">

                  <div>

                    <b>
                      ${escapeHtml(
                        r.barista_name || "—"
                      )}
                    </b>

                    <div class="muted">
                      ${date}
                    </div>

                  </div>


                  <b>
                    ${money(
                      r.actual_cash
                    )}
                  </b>

                </div>


                <div
                  class="muted"
                  style="margin-top:8px"
                >

                  Наличные:
                  ${money(r.cash)}

                  · Карта:
                  ${money(r.card)}

                  · QR:
                  ${money(r.qr)}

                </div>


                <div
                  class="muted"
                  style="margin-top:5px"
                >

                  Расходы:
                  ${money(expenses)}

                </div>

              </div>

            `;

          }
        )
        .join("");


  }

  catch(error){

    box.innerHTML =
      '<div class="empty">' +
      'Ошибка загрузки: ' +
      escapeHtml(
        error.message
      ) +
      '</div>';

  }

}



/* =========================================================
   TABS
========================================================= */

function openTab(tab){

  const report =
    document.getElementById(
      "reportTab"
    );


  const history =
    document.getElementById(
      "historyTab"
    );


  const reportButton =
    document.getElementById(
      "reportTabBtn"
    );


  const historyButton =
    document.getElementById(
      "historyTabBtn"
    );


  if(tab === "report"){

    report.classList.remove(
      "hidden"
    );


    history.classList.add(
      "hidden"
    );


    reportButton.classList.add(
      "active"
    );


    historyButton.classList.remove(
      "active"
    );

  }

  else{

    report.classList.add(
      "hidden"
    );


    history.classList.remove(
      "hidden"
    );


    reportButton.classList.remove(
      "active"
    );


    historyButton.classList.add(
      "active"
    );


    loadHistory();

  }

}



/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}
